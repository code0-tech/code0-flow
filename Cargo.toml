[package]
version = "0.0.0"
name = "code0-flow"
edition = "2024"
description = "Crate for managing the code0-flows inside of the Flow Queue & FlowStore"
repository = "https://github.com/code0-tech/code0-flow"
homepage = "https://code0.tech"
license = "Apache-2.0"

[dependencies]
tucana = { version = "0.0.72", features = ["aquila"] }
async-trait = "0.1.85"
log = "0.4.24"
tonic = "0.14.1"
dotenv = "0.15.0"
tonic-health = "0.14.1"
async-nats = "0.48.0"
futures-core = "0.3.31"
regex = "1.11.2"
serde_json = "1.0.143"
walkdir = "2.5.0"
serde = "1.0.228"
tokio = "1.49.0"

[lib]
doctest = true

[features]
default = ["all"]
flow_definition = []
flow_service = ["flow_definition"]
flow_config = []
flow_health = []
all = ["flow_definition", "flow_config", "flow_health", "flow_service"]
