[package]
version = "0.0.0"
name = "code0-flow"
edition = "2021"
description = "Crate for managing the code0-flows inside of the Flow Queue & FlowStore"
repository = "https://github.com/code0-tech/code0-flow"
homepage = "https://code0.tech"
license = "Apache-2.0"

[dependencies]
tucana = { version = "0.0.28", features = ["aquila"] }
tokio = "1.43.0"
async-trait = "0.1.85"
log = "0.4.24"
redis = { version = "0.31.0", features = [
    "aio",
    "tokio-comp",
    "async-std-comp",
    "json",
] }
serde_json = "1.0.138"
serde = "1.0.138"
lapin = "2.5.0"
futures-lite = "2.6.0"
tonic = "0.13.0"

[dev-dependencies]
testcontainers = "0.24.0"
serial_test = "3.2.0"

[lib]
doctest = true

[features]
default = ["all"]
flow_queue = []
flow_store = []
flow_definition = []
all = ["flow_queue", "flow_store", "flow_definition"]
