[package]
version = "0.0.0"
name = "code0-flow"
edition = "2024"
description = "Crate for managing the code0-flows inside of the Flow Queue & FlowStore"
repository = "https://github.com/code0-tech/code0-flow"
homepage = "https://code0.tech"
license = "Apache-2.0"

[dependencies]
tucana = { version = "0.0.32", features = ["aquila"] }
tokio = "1.43.0"
async-trait = "0.1.85"
log = "0.4.24"
serde_json = "1.0.138"
serde = "1.0.138"
tonic = "0.14.0"
dotenv = "0.15.0"
code0-definition-reader = "0.0.8"
tonic-health = "0.14.0"
async-nats = "0.42.0"
futures-core = "0.3.31"

[lib]
doctest = true

[features]
default = ["all"]
flow_definition = []
flow_config = []
flow_health = []
all = ["flow_definition", "flow_config", "flow_health"]
